<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eliauk VPN</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    background: #1E1F22; color: #EDEFF3; overflow-y: auto;
    -webkit-user-select: none; user-select: none;
  }
  input, button, textarea { -webkit-user-select: text; user-select: text; }

  .app { max-width: 560px; margin: 0 auto; padding: 20px 18px 28px; }

  /* header */
  .header { margin-bottom: 16px; }
  .title-row { display: flex; align-items: center; justify-content: space-between; }
  .title { font-size: 21px; font-weight: 700; letter-spacing: .3px; }
  .status-row { display: flex; align-items: center; gap: 9px; margin-top: 9px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #8B8E95; flex: 0 0 auto; }
  .dot.ok   { background: #3DDC6F; }
  .dot.warn { background: #FF5C5C; }
  .dot.busy { background: #F0A030; }
  .status { color: #B8BCC4; font-size: 13px; line-height: 1.45; overflow-wrap: anywhere; }

  /* cards */
  .card {
    background: #242529; border: 1px solid #302F34; border-left: 3px solid #6C5CE7;
    border-radius: 10px; padding: 15px 16px; margin-bottom: 13px;
  }
  .card h2 { font-size: 13px; font-weight: 600; color: #B8BCC4; letter-spacing: .4px; margin-bottom: 11px; }
  .label { color: #8B8E95; font-size: 12px; margin-bottom: 6px; }
  .hint { color: #8B8E95; font-size: 12px; margin-top: 8px; line-height: 1.4; }

  /* forms */
  input[type=text], input[type=password] {
    width: 100%; background: #2B2D32; border: 1px solid #3A3B40; color: #EDEFF3;
    border-radius: 6px; padding: 9px 11px; font-size: 13px; margin-bottom: 8px;
    outline: none; transition: border-color .12s;
  }
  input:focus { border-color: #6C5CE7; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .grow { flex: 2; }

  button {
    background: #6C5CE7; color: #fff; border: none; border-radius: 6px;
    padding: 9px 14px; font-size: 13px; cursor: pointer; transition: background .15s, opacity .15s;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { background: #7D6FF0; }
  button:active:not(:disabled) { background: #5A4BD1; }
  button:disabled { opacity: .4; cursor: default; }
  button.ghost { background: transparent; border: 1px solid #3A3B40; color: #B8BCC4; }
  button.ghost:hover:not(:disabled) { background: #2B2D32; }
  button.danger { background: transparent; border: 1px solid #5A2E2E; color: #FF7A7A; }
  button.danger:hover:not(:disabled) { background: #3A2222; }
  button.small { padding: 6px 10px; font-size: 12px; }

  /* friend code */
  .code {
    font-family: Consolas, "Cascadia Mono", monospace; font-size: 13px; color: #EDEFF3;
    background: #2B2D32; border: 1px solid #3A3B40; border-radius: 6px; padding: 9px 11px;
    overflow-wrap: anywhere; margin-bottom: 9px;
  }

  /* friend list */
  .friend {
    display: flex; align-items: center; gap: 9px; padding: 9px 0;
    border-bottom: 1px solid #2C2D31; transition: background .15s;
  }
  .friend:last-child { border-bottom: none; }
  .friend .name { flex: 1; font-size: 13px; overflow-wrap: anywhere; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; flex: 0 0 auto; }
  .badge.connected  { background: #17351F; color: #3DDC6F; }
  .badge.connecting { background: #3A2E12; color: #F0A030; }
  .badge.online     { background: #14273A; color: #58A6FF; }
  .badge.offline    { background: #2B2D32; color: #8B8E95; }
  .empty { color: #8B8E95; font-size: 12px; }

  /* room members */
  .member { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; }
  .member .ip { color: #8B8E95; font-size: 12px; margin-left: auto; font-family: Consolas, monospace; }
  .host-tag { font-size: 10px; padding: 1px 7px; border-radius: 10px; background: #2E2440; color: #A88BFF; flex: 0 0 auto; }

  .btn-bar { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-bar button { flex: 1 1 auto; min-width: 0; }
  .game-state { font-size: 12px; color: #8B8E95; margin-top: 9px; line-height: 1.4; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="title-row">
      <span class="title">Eliauk VPN</span>
      <button class="ghost small" id="quitTop">退出</button>
    </div>
    <div class="status-row">
      <span class="dot" id="dot"></span>
      <span class="status" id="status">加载中…</span>
    </div>
  </header>

  <section class="card" id="accountCard">
    <h2>账号</h2>
    <!-- login form (shown when logged out) -->
    <div id="loginForm">
      <input type="text" id="user" placeholder="用户名 / 账号">
      <input type="password" id="pass" placeholder="密码">
      <div class="btn-bar">
        <button id="loginBtn">登录</button>
        <button class="ghost" id="registerBtn">注册新账号</button>
      </div>
    </div>
    <!-- logged-in state -->
    <div id="accountInfo" style="display:none;">
      <div class="label">当前账号</div>
      <div class="code" id="accountName" style="margin-bottom:9px;"></div>
      <button class="ghost small" id="logoutBtn">退出登录</button>
    </div>
  </section>

  <section class="card" id="friendsCard">
    <h2>好友</h2>
    <div class="label">我的好友码</div>
    <div class="code" id="code">—</div>
    <div class="btn-bar" style="margin-bottom:10px;">
      <button id="copyBtn">复制好友码</button>
    </div>
    <input type="text" id="addInput" placeholder="输入好友码或用户名">
    <div class="btn-bar">
      <button id="addBtn">添加好友</button>
    </div>
    <div class="hint" id="addHint"></div>
    <div id="friendList" style="margin-top:10px;"></div>
  </section>

  <section class="card" id="roomCard">
    <h2>房间</h2>
    <div id="roomOut">
      <input type="text" id="joinCode" placeholder="输入房间码加入">
      <div class="btn-bar">
        <button id="joinRoomBtn">加入房间</button>
        <button class="ghost" id="createRoomBtn">创建房间</button>
      </div>
    </div>
    <div id="roomIn" style="display:none;">
      <div class="label" id="roomTitle"></div>
      <div id="memberList"></div>
      <div class="btn-bar" style="margin-top:9px;">
        <button class="ghost" id="leaveRoomBtn">离开房间</button>
      </div>
    </div>
  </section>

  <section class="card" id="gameCard">
    <h2>游戏（Minecraft 服务器）</h2>
    <div class="label">Java 路径</div>
    <input type="text" id="java" placeholder="javaw.exe 路径">
    <div class="label">服务器 jar 路径</div>
    <input type="text" id="jar" placeholder="server.jar 路径">
    <div class="btn-bar" style="margin-top:4px;">
      <button class="ghost" id="detectBtn">自动检测</button>
      <button id="startBtn">启动服务器</button>
      <button class="ghost" id="stopBtn">停止服务器</button>
    </div>
    <div class="btn-bar" style="margin-top:8px;">
      <button class="ghost" id="copyAddrBtn">复制地址</button>
      <button class="ghost" id="mcAddBtn">添加服务器</button>
      <button class="ghost" id="launchBtn">启动游戏</button>
    </div>
    <div class="game-state" id="gameState"></div>
  </section>

  <section class="card" id="settingsCard">
    <h2>设置</h2>
    <div class="label">昵称</div>
    <input type="text" id="name" placeholder="显示昵称">
    <div class="label">服务器地址</div>
    <input type="text" id="server" placeholder="ws://host:port/ws">
    <div class="btn-bar">
      <button id="saveBtn">保存并连接</button>
      <button class="danger" id="quitBtn">退出</button>
    </div>
  </section>
</div>

<script>
// Bridge surface — defined synchronously so the very first Eval never hits an
// undefined symbol. Go binds window.eliaukAction (returns a Promise); route
// everything through this shim.
window.eliauk = window.eliauk || {};
window.eliauk.action = function (o) { window.eliaukAction(JSON.stringify(o)); };

var el = function (id) { return document.getElementById(id); };
var active = function (id) { return document.activeElement === el(id); };
var setVal = function (id, v) { if (!active(id)) el(id).value = v || ""; };

var STATE_LABEL = { connected: "已连接", connecting: "连接中", online: "在线", offline: "离线" };

function render(s) {
  // status
  var d = el("dot");
  d.className = "dot " + (s.status && s.status.dot ? s.status.dot : "");
  el("status").textContent = (s.status && s.status.text) || "";

  // settings
  setVal("name", s.settings && s.settings.name);
  setVal("server", s.settings && s.settings.server);

  // account
  if (s.loggedIn) {
    el("loginForm").style.display = "none";
    el("accountInfo").style.display = "block";
    el("accountName").textContent = s.account;
  } else {
    el("loginForm").style.display = "block";
    el("accountInfo").style.display = "none";
  }

  // friends
  el("code").textContent = s.code || "";
  el("addHint").textContent = s.addHint || "";
  renderFriends(s.friends || []);

  // room
  renderRoom(s.room || {});

  // game
  setVal("java", s.game && s.game.java);
  setVal("jar", s.game && s.game.jar);
  el("gameState").textContent = (s.game && s.game.state) || "";
  el("copyAddrBtn").disabled = !(s.game && s.game.addr);
}

function renderFriends(friends) {
  var box = el("friendList");
  if (!friends.length) {
    box.innerHTML = '<div class="empty">还没有好友，先复制好友码发给朋友吧</div>';
    return;
  }
  var html = "";
  for (var i = 0; i < friends.length; i++) {
    var f = friends[i];
    var key = esc(f.key);
    var name = esc(f.name);
    html += '<div class="friend">'
      + '<span class="name">' + name + '</span>'
      + '<span class="badge ' + f.state + '">' + (STATE_LABEL[f.state] || f.state) + '</span>'
      + '<button class="ghost small" data-connect="' + key + '" ' + (f.online ? "" : "disabled") + '>连接</button>'
      + '<button class="danger small" data-del="' + key + '">删除</button>'
      + '</div>';
  }
  box.innerHTML = html;
  box.querySelectorAll("[data-connect]").forEach(function (b) {
    b.addEventListener("click", function () { window.eliauk.action({ type: "connect", name: b.getAttribute("data-connect") }); });
  });
  box.querySelectorAll("[data-del]").forEach(function (b) {
    b.addEventListener("click", function () { window.eliauk.action({ type: "deleteFriend", key: b.getAttribute("data-del") }); });
  });
}

function renderRoom(room) {
  if (room.in) {
    el("roomOut").style.display = "none";
    el("roomIn").style.display = "block";
    el("roomTitle").textContent = "房间 " + room.code + " · " + (room.members ? room.members.length : 0) + " 人";
    var html = "";
    (room.members || []).forEach(function (m) {
      html += '<div class="member">'
        + (m.host ? '<span class="host-tag">房主</span>' : '')
        + '<span>' + esc(m.username) + '</span>'
        + '<span class="ip">' + esc(m.virtualIP || "") + '</span>'
        + '</div>';
    });
    el("memberList").innerHTML = html;
  } else {
    el("roomOut").style.display = "block";
    el("roomIn").style.display = "none";
  }
}

function esc(t) {
  return String(t == null ? "" : t)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// buttons
el("quitTop").addEventListener("click", function () { window.eliauk.action({ type: "quit" }); });
el("quitBtn").addEventListener("click", function () { window.eliauk.action({ type: "quit" }); });
el("loginBtn").addEventListener("click", function () { window.eliauk.action({ type: "login", user: el("user").value, pass: el("pass").value }); });
el("registerBtn").addEventListener("click", function () { window.eliauk.action({ type: "register", user: el("user").value, pass: el("pass").value }); });
el("logoutBtn").addEventListener("click", function () { window.eliauk.action({ type: "logout" }); });
el("copyBtn").addEventListener("click", function () { window.eliauk.action({ type: "copy", text: el("code").textContent }); });
el("addBtn").addEventListener("click", function () { window.eliauk.action({ type: "addFriend", input: el("addInput").value }); el("addInput").value = ""; });
el("createRoomBtn").addEventListener("click", function () { window.eliauk.action({ type: "roomCreate" }); });
el("joinRoomBtn").addEventListener("click", function () { window.eliauk.action({ type: "roomJoin", code: el("joinCode").value }); el("joinCode").value = ""; });
el("leaveRoomBtn").addEventListener("click", function () { window.eliauk.action({ type: "roomLeave" }); });
el("detectBtn").addEventListener("click", function () { window.eliauk.action({ type: "gameDetect" }); });
el("startBtn").addEventListener("click", function () { window.eliauk.action({ type: "srvStart", java: el("java").value, jar: el("jar").value }); });
el("stopBtn").addEventListener("click", function () { window.eliauk.action({ type: "srvStop" }); });
el("copyAddrBtn").addEventListener("click", function () {
  var addr = (window._state && window._state.game && window._state.game.addr) || "";
  if (addr) window.eliauk.action({ type: "copy", text: addr });
});
el("mcAddBtn").addEventListener("click", function () { window.eliauk.action({ type: "mcAdd" }); });
el("launchBtn").addEventListener("click", function () { window.eliauk.action({ type: "launch" }); });
el("saveBtn").addEventListener("click", function () { window.eliauk.action({ type: "save", name: el("name").value, server: el("server").value }); });

// keep a copy of the last state for the copy-address button
window.eliauk.render = function (s) {
  if (typeof s === "string") s = JSON.parse(s);
  window._state = s;
  render(s);
};

window.addEventListener("DOMContentLoaded", function () {
  window.eliauk.action({ type: "ready" });
});
</script>
</body>
</html>
