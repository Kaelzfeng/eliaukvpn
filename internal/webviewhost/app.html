<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eliauk VPN</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    background: #1E1F22; color: #EDEFF3; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  input, button, textarea { -webkit-user-select: text; user-select: text; }
  button { font-family: inherit; }

  .shell { display: flex; height: 100vh; }

  /* ---- sidebar ---- */
  .sidebar {
    width: 216px; flex: 0 0 auto; background: #17181A;
    display: flex; flex-direction: column; border-right: 1px solid #26272B;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px 16px; }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 8px; flex: 0 0 auto;
    background: linear-gradient(135deg, #6C5CE7, #8E7CF0);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; color: #fff;
  }
  .brand-name { font-size: 15px; font-weight: 700; letter-spacing: .2px; }

  .nav { flex: 1; padding: 6px 10px; overflow-y: auto; }
  .nav-item {
    display: block; width: 100%; text-align: left; background: transparent; border: none;
    color: #A6A9B2; padding: 9px 13px; border-radius: 7px; font-size: 13.5px;
    cursor: pointer; transition: background .14s, color .14s; margin-bottom: 2px;
  }
  .nav-item:hover { background: #222327; color: #EDEFF3; }
  .nav-item.active { background: #6C5CE7; color: #fff; font-weight: 600; }

  .sidebar-foot { padding: 12px 14px; border-top: 1px solid #26272B; }
  .mini-status { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .mini-status-text {
    font-size: 12px; color: #8B8E95; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; flex: 1; min-width: 0;
  }
  .foot-btns { display: flex; gap: 8px; }
  .foot-btn {
    flex: 1; background: #222327; border: 1px solid #2E2F33; color: #B8BCC4;
    padding: 7px 4px; border-radius: 6px; cursor: pointer; font-size: 12px;
    transition: background .14s, color .14s, border-color .14s;
  }
  .foot-btn:hover { background: #2B2D32; color: #EDEFF3; }
  .foot-btn.danger:hover { border-color: #5A2E2E; color: #FF7A7A; }

  /* ---- main ---- */
  .main { flex: 1; overflow-y: auto; background: #1E1F22; }
  .section { display: none; padding: 26px 30px 36px; max-width: 960px; }
  .section.active { display: block; animation: fadeIn .16s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .sec-title { font-size: 19px; font-weight: 700; margin-bottom: 16px; letter-spacing: .2px; }

  /* ---- status dots ---- */
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #8B8E95; flex: 0 0 auto; }
  .dot.ok   { background: #3DDC6F; }
  .dot.warn { background: #FF5C5C; }
  .dot.busy { background: #F0A030; animation: pulse 1.2s ease-in-out infinite; }
  .dot.lg  { width: 14px; height: 14px; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .status { color: #B8BCC4; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
  .status.lg { font-size: 15px; color: #EDEFF3; }

  /* ---- cards ---- */
  .card {
    background: #242529; border: 1px solid #302F34; border-left: 3px solid #6C5CE7;
    border-radius: 10px; padding: 16px 18px; margin-bottom: 14px;
    transition: border-color .15s;
  }
  .card h2 { font-size: 13px; font-weight: 600; color: #B8BCC4; letter-spacing: .4px; margin-bottom: 12px; }
  .label { color: #8B8E95; font-size: 12px; margin-bottom: 6px; }
  .hint { color: #8B8E95; font-size: 12px; margin-top: 8px; line-height: 1.4; }

  /* overview */
  .hero .status-row { display: flex; align-items: center; gap: 12px; }
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
  .stat { border-left-width: 3px; padding: 14px 16px; margin-bottom: 0; cursor: default; }
  .stat:hover { transform: translateY(-2px); border-color: #3C3C46; }
  .stat-label { color: #8B8E95; font-size: 12px; margin-bottom: 6px; }
  .stat-value { font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }

  /* forms */
  input[type=text], input[type=password] {
    width: 100%; background: #2B2D32; border: 1px solid #3A3B40; color: #EDEFF3;
    border-radius: 6px; padding: 9px 11px; font-size: 13px; margin-bottom: 9px;
    outline: none; transition: border-color .12s, box-shadow .12s;
  }
  input:focus { border-color: #6C5CE7; box-shadow: 0 0 0 3px rgba(108,92,231,.16); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .grow { flex: 2; }

  button {
    background: #6C5CE7; color: #fff; border: none; border-radius: 6px;
    padding: 9px 14px; font-size: 13px; cursor: pointer; transition: background .15s, opacity .15s, transform .06s;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { background: #7D6FF0; }
  button:active:not(:disabled) { background: #5A4BD1; transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: default; }
  button.ghost { background: transparent; border: 1px solid #3A3B40; color: #B8BCC4; }
  button.ghost:hover:not(:disabled) { background: #2B2D32; }
  button.danger { background: transparent; border: 1px solid #5A2E2E; color: #FF7A7A; }
  button.danger:hover:not(:disabled) { background: #3A2222; }
  button.small { padding: 6px 10px; font-size: 12px; }

  /* friend code */
  .code {
    font-family: Consolas, "Cascadia Mono", monospace; font-size: 13px; color: #EDEFF3;
    background: #2B2D32; border: 1px solid #3A3B40; border-radius: 6px; padding: 9px 11px;
    overflow-wrap: anywhere; margin-bottom: 10px;
  }

  /* friend list */
  .friend {
    display: flex; align-items: center; gap: 9px; padding: 9px 8px;
    border-bottom: 1px solid #2C2D31; border-radius: 6px; transition: background .14s;
  }
  .friend:last-child { border-bottom: none; }
  .friend:hover { background: #2A2B30; }
  .friend .name { flex: 1; font-size: 13px; overflow-wrap: anywhere; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; flex: 0 0 auto; }
  .badge.connected  { background: #17351F; color: #3DDC6F; }
  .badge.connecting { background: #3A2E12; color: #F0A030; }
  .badge.online     { background: #14273A; color: #58A6FF; }
  .badge.offline    { background: #2B2D32; color: #8B8E95; }
  .empty { color: #8B8E95; font-size: 12px; }

  /* room members */
  .member { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; }
  .member .ip { color: #8B8E95; font-size: 12px; margin-left: auto; font-family: Consolas, monospace; }
  .host-tag { font-size: 10px; padding: 1px 7px; border-radius: 10px; background: #2E2440; color: #A88BFF; flex: 0 0 auto; }

  .btn-bar { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-bar button { flex: 1 1 auto; min-width: 0; }
  .game-state { font-size: 12px; color: #8B8E95; margin-top: 9px; line-height: 1.4; overflow-wrap: anywhere; }

  /* narrow window: sidebar becomes a top bar */
  @media (max-width: 720px) {
    .shell { flex-direction: column; }
    .sidebar { width: 100%; flex-direction: row; align-items: center; border-right: none; border-bottom: 1px solid #26272B; }
    .brand { padding: 10px 12px; }
    .brand-name { display: none; }
    .nav { display: flex; flex-direction: row; padding: 0; overflow-x: auto; }
    .nav-item { width: auto; padding: 8px 12px; white-space: nowrap; }
    .sidebar-foot { display: none; }
    .section { padding: 18px 16px 28px; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">E</span>
      <span class="brand-name">Eliauk VPN</span>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-sec="overview">概览</button>
      <button class="nav-item" data-sec="friends">好友</button>
      <button class="nav-item" data-sec="room">房间</button>
      <button class="nav-item" data-sec="game">游戏</button>
      <button class="nav-item" data-sec="account">账号</button>
      <button class="nav-item" data-sec="settings">设置</button>
    </nav>
    <div class="sidebar-foot">
      <div class="mini-status">
        <span class="dot" id="sideDot"></span>
        <span class="mini-status-text" id="miniStatus">加载中…</span>
      </div>
      <div class="foot-btns">
        <button class="foot-btn" id="fullscreenBtn" title="全屏 (F11)">全屏</button>
        <button class="foot-btn danger" id="quitBtn" title="退出 Eliauk VPN">退出</button>
      </div>
    </div>
  </aside>

  <main class="main">

    <section class="section active" id="sec-overview">
      <h1 class="sec-title">概览</h1>
      <div class="card hero">
        <div class="status-row">
          <span class="dot lg" id="dot"></span>
          <span class="status lg" id="status">加载中…</span>
        </div>
      </div>
      <div class="stat-grid">
        <div class="card stat"><div class="stat-label">好友</div><div class="stat-value" id="statFriends">0</div></div>
        <div class="card stat"><div class="stat-label">房间</div><div class="stat-value" id="statRoom">未加入</div></div>
        <div class="card stat"><div class="stat-label">游戏</div><div class="stat-value" id="statGame">未运行</div></div>
        <div class="card stat"><div class="stat-label">账号</div><div class="stat-value" id="statAccount">未登录</div></div>
      </div>
      <div class="card">
        <h2>快速上手</h2>
        <div class="hint" style="margin-top:0;" id="quickHint">先在「设置」里填昵称和服务器地址并保存连接，然后在「账号」注册登录，再把好友码发给朋友即可联机。</div>
      </div>
    </section>

    <section class="section" id="sec-friends">
      <h1 class="sec-title">好友</h1>
      <div class="card">
        <div class="label">我的好友码</div>
        <div class="code" id="code">—</div>
        <button id="copyBtn">复制好友码</button>
      </div>
      <div class="card">
        <input type="text" id="addInput" placeholder="输入好友码或用户名">
        <button id="addBtn">添加好友</button>
        <div class="hint" id="addHint"></div>
        <div id="friendList" style="margin-top:10px;"></div>
      </div>
    </section>

    <section class="section" id="sec-room">
      <h1 class="sec-title">房间</h1>
      <div class="card" id="roomOut">
        <input type="text" id="joinCode" placeholder="输入房间码加入">
        <div class="btn-bar">
          <button id="joinRoomBtn">加入房间</button>
          <button class="ghost" id="createRoomBtn">创建房间</button>
        </div>
      </div>
      <div class="card" id="roomIn" style="display:none;">
        <div class="label" id="roomTitle"></div>
        <div id="memberList"></div>
        <div class="btn-bar" style="margin-top:10px;">
          <button class="ghost" id="leaveRoomBtn">离开房间</button>
        </div>
      </div>
    </section>

    <section class="section" id="sec-game">
      <h1 class="sec-title">游戏（Minecraft 服务器）</h1>
      <div class="card">
        <div class="label">Java 路径</div>
        <input type="text" id="java" placeholder="javaw.exe 路径">
        <div class="label">服务器 jar 路径</div>
        <input type="text" id="jar" placeholder="server.jar 路径">
        <div class="btn-bar" style="margin-top:4px;">
          <button class="ghost" id="detectBtn">自动检测</button>
          <button id="startBtn">启动服务器</button>
          <button class="ghost" id="stopBtn">停止服务器</button>
        </div>
        <div class="btn-bar" style="margin-top:8px;">
          <button class="ghost" id="copyAddrBtn">复制地址</button>
          <button class="ghost" id="mcAddBtn">添加服务器</button>
          <button class="ghost" id="launchBtn">启动游戏</button>
        </div>
        <div class="game-state" id="gameState"></div>
      </div>
    </section>

    <section class="section" id="sec-account">
      <h1 class="sec-title">账号</h1>
      <div class="card">
        <div id="loginForm">
          <input type="text" id="user" placeholder="用户名 / 账号">
          <input type="password" id="pass" placeholder="密码">
          <div class="btn-bar">
            <button id="loginBtn">登录</button>
            <button class="ghost" id="registerBtn">注册新账号</button>
          </div>
        </div>
        <div id="accountInfo" style="display:none;">
          <div class="label">当前账号</div>
          <div class="code" id="accountName" style="margin-bottom:10px;"></div>
          <button class="ghost small" id="logoutBtn">退出登录</button>
        </div>
      </div>
    </section>

    <section class="section" id="sec-settings">
      <h1 class="sec-title">设置</h1>
      <div class="card">
        <div class="label">昵称</div>
        <input type="text" id="name" placeholder="显示昵称">
        <div class="label">服务器地址</div>
        <input type="text" id="server" placeholder="ws://host:port/ws">
        <button id="saveBtn">保存并连接</button>
      </div>
    </section>

  </main>
</div>

<script>
// Bridge surface — defined synchronously so the very first Eval never hits an
// undefined symbol. Go binds window.eliaukAction (returns a Promise); route
// everything through this shim.
window.eliauk = window.eliauk || {};
window.eliauk.action = function (o) { window.eliaukAction(JSON.stringify(o)); };

var el = function (id) { return document.getElementById(id); };
var active = function (id) { return document.activeElement === el(id); };
var setVal = function (id, v) { if (!active(id)) el(id).value = v || ""; };

var STATE_LABEL = { connected: "已连接", connecting: "连接中", online: "在线", offline: "离线" };

// sidebar navigation
var navs = document.querySelectorAll(".nav-item");
var sections = document.querySelectorAll(".section");
function setSection(name) {
  navs.forEach(function (n) { n.classList.toggle("active", n.getAttribute("data-sec") === name); });
  sections.forEach(function (sec) { sec.classList.toggle("active", sec.id === "sec-" + name); });
}
navs.forEach(function (n) {
  n.addEventListener("click", function () { setSection(n.getAttribute("data-sec")); });
});

function render(s) {
  var st = s.status || {};
  var cls = "dot " + (st.dot || "");
  el("dot").className = "dot lg " + (st.dot || "");
  el("sideDot").className = cls;
  el("status").textContent = st.text || "";
  el("miniStatus").textContent = st.text || "";
  el("miniStatus").title = st.text || "";

  el("fullscreenBtn").textContent = s.fullscreen ? "退出全屏" : "全屏";

  // overview stats
  el("statFriends").textContent = (s.friends || []).length;
  el("statRoom").textContent = (s.room && s.room.in) ? s.room.code : "未加入";
  el("statGame").textContent = (s.game && s.game.running) ? "运行中" : "未运行";
  el("statAccount").textContent = s.loggedIn ? s.account : "未登录";

  // settings
  setVal("name", s.settings && s.settings.name);
  setVal("server", s.settings && s.settings.server);

  // account
  if (s.loggedIn) {
    el("loginForm").style.display = "none";
    el("accountInfo").style.display = "block";
    el("accountName").textContent = s.account;
  } else {
    el("loginForm").style.display = "block";
    el("accountInfo").style.display = "none";
  }

  // friends
  el("code").textContent = s.code || "";
  el("addHint").textContent = s.addHint || "";
  renderFriends(s.friends || []);

  renderRoom(s.room || {});

  setVal("java", s.game && s.game.java);
  setVal("jar", s.game && s.game.jar);
  el("gameState").textContent = (s.game && s.game.state) || "";
  el("copyAddrBtn").disabled = !(s.game && s.game.addr);
}

function renderFriends(friends) {
  var box = el("friendList");
  if (!friends.length) {
    box.innerHTML = '<div class="empty">还没有好友，先复制好友码发给朋友吧</div>';
    return;
  }
  var html = "";
  for (var i = 0; i < friends.length; i++) {
    var f = friends[i];
    var key = esc(f.key);
    var name = esc(f.name);
    html += '<div class="friend">'
      + '<span class="name">' + name + '</span>'
      + '<span class="badge ' + f.state + '">' + (STATE_LABEL[f.state] || f.state) + '</span>'
      + '<button class="ghost small" data-connect="' + key + '" ' + (f.online ? "" : "disabled") + '>连接</button>'
      + '<button class="danger small" data-del="' + key + '">删除</button>'
      + '</div>';
  }
  box.innerHTML = html;
  box.querySelectorAll("[data-connect]").forEach(function (b) {
    b.addEventListener("click", function () { window.eliauk.action({ type: "connect", name: b.getAttribute("data-connect") }); });
  });
  box.querySelectorAll("[data-del]").forEach(function (b) {
    b.addEventListener("click", function () { window.eliauk.action({ type: "deleteFriend", key: b.getAttribute("data-del") }); });
  });
}

function renderRoom(room) {
  if (room.in) {
    el("roomOut").style.display = "none";
    el("roomIn").style.display = "block";
    el("roomTitle").textContent = "房间 " + room.code + " · " + (room.members ? room.members.length : 0) + " 人";
    var html = "";
    (room.members || []).forEach(function (m) {
      html += '<div class="member">'
        + (m.host ? '<span class="host-tag">房主</span>' : '')
        + '<span>' + esc(m.username) + '</span>'
        + '<span class="ip">' + esc(m.virtualIP || "") + '</span>'
        + '</div>';
    });
    el("memberList").innerHTML = html;
  } else {
    el("roomOut").style.display = "block";
    el("roomIn").style.display = "none";
  }
}

function esc(t) {
  return String(t == null ? "" : t)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// buttons
el("fullscreenBtn").addEventListener("click", function () { window.eliauk.action({ type: "fullscreen" }); });
el("quitBtn").addEventListener("click", function () { window.eliauk.action({ type: "quit" }); });
el("loginBtn").addEventListener("click", function () { window.eliauk.action({ type: "login", user: el("user").value, pass: el("pass").value }); });
el("registerBtn").addEventListener("click", function () { window.eliauk.action({ type: "register", user: el("user").value, pass: el("pass").value }); });
el("logoutBtn").addEventListener("click", function () { window.eliauk.action({ type: "logout" }); });
el("copyBtn").addEventListener("click", function () { window.eliauk.action({ type: "copy", text: el("code").textContent }); });
el("addBtn").addEventListener("click", function () { window.eliauk.action({ type: "addFriend", input: el("addInput").value }); el("addInput").value = ""; });
el("createRoomBtn").addEventListener("click", function () { window.eliauk.action({ type: "roomCreate" }); });
el("joinRoomBtn").addEventListener("click", function () { window.eliauk.action({ type: "roomJoin", code: el("joinCode").value }); el("joinCode").value = ""; });
el("leaveRoomBtn").addEventListener("click", function () { window.eliauk.action({ type: "roomLeave" }); });
el("detectBtn").addEventListener("click", function () { window.eliauk.action({ type: "gameDetect" }); });
el("startBtn").addEventListener("click", function () { window.eliauk.action({ type: "srvStart", java: el("java").value, jar: el("jar").value }); });
el("stopBtn").addEventListener("click", function () { window.eliauk.action({ type: "srvStop" }); });
el("copyAddrBtn").addEventListener("click", function () {
  var addr = (window._state && window._state.game && window._state.game.addr) || "";
  if (addr) window.eliauk.action({ type: "copy", text: addr });
});
el("mcAddBtn").addEventListener("click", function () { window.eliauk.action({ type: "mcAdd" }); });
el("launchBtn").addEventListener("click", function () { window.eliauk.action({ type: "launch" }); });
el("saveBtn").addEventListener("click", function () { window.eliauk.action({ type: "save", name: el("name").value, server: el("server").value }); });

// fullscreen: F11 toggles, Escape exits when already fullscreen
document.addEventListener("keydown", function (e) {
  if (e.key === "F11") {
    e.preventDefault();
    window.eliauk.action({ type: "fullscreen" });
  } else if (e.key === "Escape" && window._state && window._state.fullscreen) {
    e.preventDefault();
    window.eliauk.action({ type: "fullscreen" });
  }
});

// keep a copy of the last state for the copy-address + fullscreen handlers
window.eliauk.render = function (s) {
  if (typeof s === "string") s = JSON.parse(s);
  window._state = s;
  render(s);
};

window.addEventListener("DOMContentLoaded", function () {
  window.eliauk.action({ type: "ready" });
});
</script>
</body>
</html>
